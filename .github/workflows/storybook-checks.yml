name: Storybook quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install exact project dependency versions
        run: npm install --no-audit --no-fund
      - name: Build all stories and responsive artwork
        run: npm run build
      - name: Validate content, links, captions, and media
        run: npm run check && npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check reading and media flows on phone, tablet, and desktop
        run: npm run test:browser
      - name: Save verification report and layout screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storybook-verification
          retention-days: 14
          path: |
            playwright-report/
            test-results/
            dist/build-report.json
            package-lock.json
